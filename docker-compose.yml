# Box καταστήματος: εφαρμογή + PostgreSQL. Οι εκτυπωτές είναι στο ίδιο LAN.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nido
      POSTGRES_USER: nido
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nido"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nido:change-me@db:5432/nido
      NIDO_SECRET: change-me-to-a-long-random-string
      NIDO_MODE: store
      NIDO_SEED_DEMO: "1"           # βάλε 0 όταν περάσεις το πραγματικό μενού
      TZ: Europe/Athens
      # Cloud dashboard συνεταίρων (προαιρετικό):
      # CLOUD_SYNC_URL: https://nido-cloud.example.com
      # CLOUD_SYNC_KEY: same-long-random-key-as-cloud
    ports:
      - "3000:3000"

volumes:
  pgdata:
